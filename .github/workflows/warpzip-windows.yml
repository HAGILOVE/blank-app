name: WARPZIP Windows build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
    paths: ["warpzip/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: warpzip

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System libraries for Qt offscreen + 7z
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 p7zip-full fonts-noto-cjk
        working-directory: .
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env: { QT_QPA_PLATFORM: offscreen }

  build-windows:
    needs: test-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: Run tests on Windows
        run: pytest -q
        env: { QT_QPA_PLATFORM: offscreen }
      - name: 7-Zip engine (optional RAR/ISO/CAB support)
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          New-Item bin -ItemType Directory -Force | Out-Null
          Copy-Item "C:\Program Files\7-Zip\7z.exe", "C:\Program Files\7-Zip\7z.dll", "C:\Program Files\7-Zip\License.txt" bin\
      - name: Inno Setup + Korean installer language (optional)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $dir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          if (-not (Test-Path "$dir\Korean.isl")) {
            foreach ($u in @(
              "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Korean.isl",
              "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Korean.isl")) {
              try { Invoke-WebRequest $u -OutFile "$dir\Korean.isl"; Write-Host "Korean.isl from $u"; break } catch { Write-Warning "no Korean.isl at $u" }
            }
          }
          $global:LASTEXITCODE = 0
      - name: Build (PyInstaller + Inno Setup + portable zip)
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Version "1.0.${{ github.run_number }}"
      # Code signing: provide a certificate through repository secrets, e.g.
      #   SIGN_PFX_BASE64 / SIGN_PFX_PASSWORD, then run signtool on dist\WarpZip\*.exe and the setup before upload.
      - uses: actions/upload-artifact@v4
        with:
          name: WarpZip-windows
          path: |
            warpzip/dist/*-setup.exe
            warpzip/dist/*-portable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: WarpZip-windows, path: out }
      - uses: softprops/action-gh-release@v2
        with: { files: out/* }
